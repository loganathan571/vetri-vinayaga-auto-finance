<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="description" content="Vetri Vinayaga Auto Finance"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><title>Vetri Vinayaga Auto Finance</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#0b1220;padding-bottom:78px}.top{background:#0b1220;color:#fff;padding:28px 22px 24px;border-radius:0 0 28px 28px}.brand{font-size:27px;font-weight:850}.sub{opacity:.68;margin-top:4px}.search{margin-top:18px;width:100%;padding:15px 17px;border-radius:18px;border:1px solid #27334d;background:#172139;color:#fff;font-size:16px;outline:0}.content{padding:22px 18px}.title{font-size:24px;font-weight:850;margin:8px 0 16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card,.item,.empty{background:#fff;border:1px solid #e4e7ee;border-radius:22px;padding:18px;box-shadow:0 5px 20px #0b12200a}.muted{color:#687184}.metric{font-size:27px;font-weight:850;margin-top:6px}.green{color:#15915d}.red{color:#df3d3d}.blue{color:#1d62d8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.action{border:1px solid #e2e5eb;background:#fff;border-radius:20px;padding:22px 18px;font-size:19px;font-weight:800;text-align:left}.action.primary,.btn.primary{background:#2166d9;color:#fff;border-color:#2166d9}.action b{display:block;font-size:34px;margin-bottom:8px}.list{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#e7f8ee;color:#17794e;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.pill.amber{background:#fff3df;color:#a65a18}.btn{border:1px solid #e1e5ed;background:#f4f6fa;color:#0b1220;border-radius:16px;padding:13px 17px;font-weight:800;font-size:16px}.btnrow{display:flex;gap:10px;margin-top:14px}.btnrow .btn{flex:1}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e4e6ec;display:grid;grid-template-columns:repeat(4,1fr);z-index:50}.nav{border:0;background:#fff;padding:11px 4px 9px;color:#6b7280;font-size:13px}.nav span{display:block;font-size:23px;line-height:23px}.nav.active{color:#2166d9;font-weight:800}.field{margin:12px 0}.field label,.v4label{display:block;font-size:13px;font-weight:800;color:#566074;margin-bottom:6px}.field input,.field textarea,.field select,.v4input{width:100%;padding:13px 14px;border:1px solid #d9dee8;border-radius:14px;background:#fff;font-size:16px;outline:0}.field textarea{min-height:80px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet{max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:22px;position:absolute;left:0;right:0;bottom:0}.modal{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:flex-end}.hidden{display:none!important}.detailhead{background:#0b1220;color:#fff;border-radius:20px;padding:17px;margin:12px 0}.progress{height:8px;background:#e8ebf1;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#2166d9}.tab{display:flex;gap:9px;margin-bottom:15px}.tab button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 16px}.tab .sel{background:#2166d9;color:#fff;border-color:#2166d9}.small{font-size:12px}.v4section{font-size:18px;font-weight:850;margin:20px 0 8px}.photoRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photoBox{border:1px dashed #bcc4d2;border-radius:16px;padding:10px;background:#fafbfc}.photoBox img{width:100%;max-height:140px;object-fit:cover;border-radius:12px;margin-top:7px}.summary{background:#f6f8fb;border:1px solid #e1e5ec;border-radius:18px;padding:15px;line-height:1.8}.schedule{width:100%;border-collapse:collapse;font-size:13px}.schedule th,.schedule td{border-bottom:1px solid #e7eaf0;padding:9px 5px;text-align:left}.notice{background:#fff6df;border:1px solid #f2d49b;border-radius:14px;padding:11px;font-size:13px}.fab{position:fixed;right:22px;bottom:94px;width:62px;height:62px;border-radius:50%;border:0;background:#2166d9;color:#fff;font-size:38px;box-shadow:0 8px 24px #2166d944;z-index:40}
@media(max-width:420px){.brand{font-size:24px}.grid2,.photoRow{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.content{padding:18px 14px}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"></div><script>
const KEY='vvaf_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{customers:[],vehicles:[],finances:[],payments:[],transactions:[]};
db.customers=Array.isArray(db.customers)?db.customers:[];db.vehicles=Array.isArray(db.vehicles)?db.vehicles:[];db.finances=Array.isArray(db.finances)?db.finances:[];db.payments=Array.isArray(db.payments)?db.payments:[];db.transactions=Array.isArray(db.transactions)?db.transactions:[];
let page='home';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function today(){return new Date().toISOString().slice(0,10)}function addMonths(s,n){let d=new Date(s+'T12:00:00'),day=d.getDate(),y=d.getFullYear(),m=d.getMonth()+n,last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last),12).toISOString().slice(0,10)}function toast(t){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b1220;color:#fff;padding:12px 17px;border-radius:14px;z-index:300;font-weight:800';document.body.appendChild(x)}x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1800)}
function paidFor(f){return db.payments.filter(p=>p.financeId===f.id).reduce((s,p)=>s+Number(p.amount||0),0)}function installmentFor(f){let ps=db.payments.filter(p=>p.financeId===f.id);return Math.min(f.tenure||1,ps.length+1)}function outstanding(f){return Math.max(0,Number(f.totalPayable||0)-paidFor(f))}function dueStatus(f){let paid=db.payments.filter(p=>p.financeId===f.id).length;return paid>=Number(f.tenure||0)?'COMPLETED':'DUE'}
function stats(){let income=db.transactions.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0),expense=db.transactions.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0),out=db.finances.reduce((a,f)=>a+outstanding(f),0);return{income,expense,out,active:db.finances.filter(f=>dueStatus(f)!=='COMPLETED').length}}
function nav(){return `<div class="bottom"><button class="nav ${page==='home'?'active':''}" onclick="go('home')"><span>⌂</span>Home</button><button class="nav ${page==='customers'?'active':''}" onclick="go('customers')"><span>👤</span>Customers</button><button class="nav ${page==='collection'?'active':''}" onclick="go('collection')"><span>₹</span>Collection</button><button class="nav ${page==='more'?'active':''}" onclick="go('more')"><span>☷</span>More</button></div>`}
function home(){let s=stats();return `<div class="top"><div class="brand">Vetri Vinayaga Auto Finance</div><div class="sub">Second-hand Two Wheeler Finance</div><input class="search" placeholder="🔍 Party / Mobile / Vehicle No" oninput="search(this.value)"></div><div class="content"><div class="title">இன்றைய நிலவரம்</div><div class="cards"><div class="card"><div class="muted">Total Collection</div><div class="metric green">${money(s.income)}</div></div><div class="card"><div class="muted">Total Expense</div><div class="metric red">${money(s.expense)}</div></div><div class="card"><div class="muted">Active Finance</div><div class="metric">${s.active}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric blue">${money(s.out)}</div></div></div><div class="actions"><button class="action primary" onclick="openFinance()"><b>＋</b>New Finance</button><button class="action" onclick="go('collection')"><b>₹</b>Collect EMI</button></div><div class="title">Recent Payments</div>${recent()}</div>${nav()}<button class="fab" onclick="openFinance()">＋</button>`}
function recent(){let a=db.payments.slice(-5).reverse();return a.length?`<div class="list">${a.map(p=>{let f=db.finances.find(x=>x.id===p.financeId),c=f&&db.customers.find(x=>x.id===f.customerId);return `<div class="item"><div class="row"><b>${esc(c?.name||'Customer')}</b><span class="pill">PAID</span></div><div class="muted">${esc(f?.vehicleNo||'')} · ${new Date(p.date).toLocaleDateString('en-IN')}</div><div style="margin-top:5px;font-weight:800">${money(p.amount)}</div></div>`}).join('')}</div>`:'<div class="empty">இன்னும் payment இல்லை</div>'}
function customers(){return `<div class="top"><div class="brand">Customers</div><div class="sub">Customer & RC details</div></div><div class="content"><div class="actions"><button class="action primary" onclick="openCustomer()"><b>＋</b>New Customer</button><button class="action" onclick="openFinance()"><b>₹</b>New Finance</button></div>${db.customers.length?`<div class="list">${db.customers.slice().reverse().map(c=>{let fs=db.finances.filter(x=>x.customerId===c.id),f=fs[0];return `<div class="item" onclick="customerDetail('${c.id}')"><div class="row"><b>${esc(c.name)}</b><span class="pill ${f?'':'amber'}">${f?'ACTIVE':'NO FINANCE'}</span></div><div class="muted">📞 ${esc(c.mobile||'-')} · 🛵 ${esc(f?.vehicleNo||'No vehicle')}</div><div style="margin-top:7px">${f?`EMI ${money(f.emi)} · ${f.tenure} months`:'Add finance'}</div></div>`}).join('')}</div>`:'<div class="empty">Customer இல்லை.<br>New Customer-ஐ press பண்ணுங்க.</div>'}</div>${nav()}<button class="fab" onclick="openCustomer()">＋</button>`}
function collection(){let fs=db.finances.filter(f=>dueStatus(f)!=='COMPLETED');return `<div class="top"><div class="brand">EMI Collection</div><div class="sub">Due / Pending / Payment history</div></div><div class="content"><div class="tab"><button class="sel">Pending</button><button onclick="showOverdue()">Overdue</button><button onclick="showUpcoming()">Upcoming</button></div>${fs.length?`<div class="list">${fs.map(f=>{let c=db.customers.find(x=>x.id===f.customerId),inst=installmentFor(f);return `<div class="item"><div class="row"><b>${esc(c?.name||'Customer')}</b><span class="pill amber">DUE</span></div><div class="muted">${esc(f.vehicleNo||'')} · EMI #${inst} / ${f.tenure}</div><div class="row" style="margin-top:8px"><b>${money(f.emi)}</b><button class="btn primary" onclick="openPayment('${f.id}')">Collect</button></div></div>`}).join('')}</div>`:'<div class="empty">Pending EMI இல்லை.</div>'}</div>${nav()}<button class="fab" onclick="openPayment()">＋</button>`}
function showOverdue(){let a=db.finances.filter(f=>dueStatus(f)!=='COMPLETED'&&f.schedule&&f.schedule[installmentFor(f)-1]&&f.schedule[installmentFor(f)-1].dueDate<today());alert(a.length?`${a.length} overdue finance account(s). Collection tab-la Collect use பண்ணுங்க.`:'Overdue இல்லை.')}function showUpcoming(){let a=db.finances.filter(f=>dueStatus(f)!=='COMPLETED');alert(a.length?`${a.length} active finance account(s). Upcoming due dates customer detail-la பார்க்கலாம்.`:'Upcoming இல்லை.')}
function more(){let s=stats();return `<div class="top"><div class="brand">Reports & Accounts</div><div class="sub">Business summary</div></div><div class="content"><button class="action" style="width:100%;margin-bottom:15px" onclick="openSettings()">⚙️ Settings & Backup</button><div class="cards"><div class="card"><div class="muted">Income</div><div class="metric green">${money(s.income)}</div></div><div class="card"><div class="muted">Expense</div><div class="metric red">${money(s.expense)}</div></div></div><div class="actions"><button class="action" onclick="openTransaction('income')"><b>＋</b>Add Income</button><button class="action" onclick="openTransaction('expense')"><b>−</b>Add Expense</button></div><div class="title">Reports</div><div class="list"><button class="action" onclick="openReports()">📊 Collection & Expense Reports</button><button class="action" onclick="openCustomerStatement()">👤 Customer Statement</button><button class="action" onclick="openReceiptList()">🧾 Payment Receipts</button></div><div class="title">Transactions</div><div class="list">${db.transactions.slice().reverse().map(t=>`<div class="item"><div class="row"><b>${esc(t.category)}</b><span class="${t.type==='income'?'green':'red'}">${t.type==='income'?'+':'-'}${money(t.amount)}</span></div><div class="muted">${esc(t.note||'')} · ${new Date(t.date).toLocaleDateString('en-IN')}</div></div>`).join('')||'<div class="empty">Transactions இல்லை</div>'}</div></div>${nav()}`}

function dateKey(iso){return new Date(iso).toISOString().slice(0,10)}
function monthKey(iso){let d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function sumTx(arr,type){return arr.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount||0),0)}
function openReports(){let now=new Date(),d=dateKey(now.toISOString()),m=monthKey(now.toISOString());let dayTx=db.transactions.filter(x=>dateKey(x.date)===d),monTx=db.transactions.filter(x=>monthKey(x.date)===m),dayPay=db.payments.filter(x=>dateKey(x.date)===d),monPay=db.payments.filter(x=>monthKey(x.date)===m);let dayIncome=sumTx(dayTx,'income'),dayExpense=sumTx(dayTx,'expense'),monIncome=sumTx(monTx,'income'),monExpense=sumTx(monTx,'expense');modal(`<h2>📊 Reports</h2><div class="card"><b>Today · ${d}</b><div class="grid2" style="margin-top:10px"><div><div class="muted">Collection</div><b class="green">${money(dayIncome)}</b></div><div><div class="muted">Expense</div><b class="red">${money(dayExpense)}</b></div><div><div class="muted">Net</div><b>${money(dayIncome-dayExpense)}</b></div><div><div class="muted">EMI Payments</div><b>${dayPay.length}</b></div></div></div><div class="card" style="margin-top:10px"><b>This Month · ${m}</b><div class="grid2" style="margin-top:10px"><div><div class="muted">Collection</div><b class="green">${money(monIncome)}</b></div><div><div class="muted">Expense</div><b class="red">${money(monExpense)}</b></div><div><div class="muted">Net</div><b>${money(monIncome-monExpense)}</b></div><div><div class="muted">EMI Payments</div><b>${monPay.length}</b></div></div></div><div class="v4section">Outstanding by Finance</div><div class="list">${db.finances.map(f=>{let c=db.customers.find(x=>x.id===f.customerId);return `<div class="item"><div class="row"><b>${esc(c?.name||'Customer')}</b><b>${money(outstanding(f))}</b></div><div class="muted">${esc(f.vehicleNo||'')} · EMI ${money(f.emi)}</div></div>`}).join('')||'<div class="empty">Finance இல்லை</div>'}</div><div class="btnrow"><button class="btn" onclick="printReports()">🖨️ Print / Save PDF</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function printReports(){let s=stats(),now=new Date(),d=dateKey(now.toISOString()),m=monthKey(now.toISOString()),day=db.transactions.filter(x=>dateKey(x.date)===d),mon=db.transactions.filter(x=>monthKey(x.date)===m);let html=`<html><head><title>Vetri Vinayaga Reports</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:24px}h1{margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ddd;padding:8px;text-align:left}.r{text-align:right}</style></head><body><h1>Vetri Vinayaga Auto Finance</h1><div>Report generated: ${new Date().toLocaleString('en-IN')}</div><h2>Today (${d})</h2><p>Collection: ${money(sumTx(day,'income'))} &nbsp; Expense: ${money(sumTx(day,'expense'))} &nbsp; Net: ${money(sumTx(day,'income')-sumTx(day,'expense'))}</p><h2>This Month (${m})</h2><p>Collection: ${money(sumTx(mon,'income'))} &nbsp; Expense: ${money(sumTx(mon,'expense'))} &nbsp; Net: ${money(sumTx(mon,'income')-sumTx(mon,'expense'))}</p><h2>Finance Outstanding</h2><table><tr><th>Customer</th><th>Vehicle</th><th>EMI</th><th>Outstanding</th></tr>${db.finances.map(f=>{let c=db.customers.find(x=>x.id===f.customerId);return `<tr><td>${esc(c?.name||'Customer')}</td><td>${esc(f.vehicleNo||'')}</td><td>${money(f.emi)}</td><td>${money(outstanding(f))}</td></tr>`}).join('')}</table></body></html>`;let w=window.open('','_blank');if(!w)return toast('Popup allow பண்ணுங்க');w.document.write(html);w.document.close();setTimeout(()=>w.print(),300)}
function openCustomerStatement(){if(!db.customers.length)return toast('Customer இல்லை');modal(`<h2>👤 Customer Statement</h2><div class="field"><label>Select Customer</label><select id="stmt_c">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} - ${esc(c.mobile||'')}</option>`).join('')}</select></div><div class="btnrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="showCustomerStatement()">View Statement</button></div>`)}
function showCustomerStatement(){let id=document.getElementById('stmt_c').value,c=db.customers.find(x=>x.id===id),fs=db.finances.filter(f=>f.customerId===id),ps=db.payments.filter(p=>fs.some(f=>f.id===p.financeId));let totalPaid=ps.reduce((a,p)=>a+Number(p.amount||0),0),out=fs.reduce((a,f)=>a+outstanding(f),0);modal(`<h2>${esc(c?.name||'Customer')} — Statement</h2><div class="detailhead"><b>📞 ${esc(c?.mobile||'-')}</b><div class="sub">${esc(c?.address||'')}</div><div style="margin-top:8px">Total Paid: ${money(totalPaid)} · Outstanding: ${money(out)}</div></div><div class="v4section">Finance Accounts</div>${fs.map(f=>`<div class="card" style="margin-bottom:10px"><div class="row"><b>${esc(f.vehicleNo||'')}</b><b>${money(outstanding(f))}</b></div><div class="muted">EMI ${money(f.emi)} · ${f.tenure} months</div></div>`).join('')||'<div class="empty">Finance இல்லை</div>'}<div class="v4section">Payment History</div>${ps.length?`<div class="list">${ps.slice().reverse().map(p=>{let f=db.finances.find(x=>x.id===p.financeId);return `<div class="item"><div class="row"><b>EMI #${p.installment||'-'}</b><b class="green">${money(p.amount)}</b></div><div class="muted">${esc(f?.vehicleNo||'')} · ${new Date(p.date).toLocaleDateString('en-IN')} · ${esc(p.mode||'')}</div></div>`}).join('')}</div>`:'<div class="empty">Payment இல்லை</div>'}<div class="btnrow"><button class="btn" onclick="printStatement('${id}')">🖨️ Print / Save PDF</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function printStatement(id){let c=db.customers.find(x=>x.id===id),fs=db.finances.filter(f=>f.customerId===id),ps=db.payments.filter(p=>fs.some(f=>f.id===p.financeId));let w=window.open('','_blank');if(!w)return toast('Popup allow பண்ணுங்க');let rows=ps.map(p=>{let f=db.finances.find(x=>x.id===p.financeId);return `<tr><td>${p.installment||'-'}</td><td>${esc(f?.vehicleNo||'')}</td><td>${new Date(p.date).toLocaleDateString('en-IN')}</td><td>${money(p.amount)}</td><td>${esc(p.mode||'')}</td></tr>`}).join('');w.document.write(`<html><head><title>Customer Statement</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:8px}</style></head><body><h1>Vetri Vinayaga Auto Finance</h1><h2>Customer Statement</h2><p><b>${esc(c?.name||'')}</b><br>${esc(c?.mobile||'')}<br>${esc(c?.address||'')}</p><table><tr><th>EMI</th><th>Vehicle</th><th>Date</th><th>Amount</th><th>Mode</th></tr>${rows||'<tr><td colspan="5">No payments</td></tr>'}</table></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function openReceiptList(){let ps=db.payments.slice().reverse();modal(`<h2>🧾 Payment Receipts</h2>${ps.length?`<div class="list">${ps.map(p=>{let f=db.finances.find(x=>x.id===p.financeId),c=f&&db.customers.find(x=>x.id===f.customerId);return `<div class="item"><div class="row"><b>${esc(c?.name||'Customer')}</b><b class="green">${money(p.amount)}</b></div><div class="muted">EMI #${p.installment||'-'} · ${esc(f?.vehicleNo||'')} · ${new Date(p.date).toLocaleDateString('en-IN')}</div><div class="btnrow"><button class="btn primary" onclick="printReceipt('${p.id}')">🧾 Print Receipt</button></div></div>`}).join('')}</div>`:'<div class="empty">Payment receipts இல்லை</div>'}<div class="btnrow"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function printReceipt(id){let p=db.payments.find(x=>x.id===id),f=p&&db.finances.find(x=>x.id===p.financeId),c=f&&db.customers.find(x=>x.id===f.customerId);if(!p)return;let w=window.open('','_blank');if(!w)return toast('Popup allow பண்ணுங்க');w.document.write(`<html><head><title>Payment Receipt</title><style>body{font-family:Arial;padding:28px;max-width:600px;margin:auto}.box{border:1px solid #ddd;border-radius:12px;padding:18px}h1{font-size:22px}</style></head><body><h1>Vetri Vinayaga Auto Finance</h1><div class="box"><h2>Payment Receipt</h2><p><b>Customer:</b> ${esc(c?.name||'Customer')}</p><p><b>Mobile:</b> ${esc(c?.mobile||'-')}</p><p><b>Vehicle:</b> ${esc(f?.vehicleNo||'-')}</p><p><b>EMI:</b> #${p.installment||'-'}</p><p><b>Date:</b> ${new Date(p.date).toLocaleDateString('en-IN')}</p><p><b>Payment Mode:</b> ${esc(p.mode||'-')}</p><h2>Amount: ${money(p.amount)}</h2><p>${esc(p.note||'')}</p></div></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function go(p){page=p;render()}function render(){document.getElementById('app').innerHTML=page==='home'?home():page==='customers'?customers():page==='collection'?collection():more()}
function openCustomer(){modal(`<h2>New Customer</h2><div class="field"><label>Name *</label><input id="c_name"></div><div class="grid2"><div class="field"><label>Mobile</label><input id="c_mobile" inputmode="tel"></div><div class="field"><label>Alternate Mobile</label><input id="c_alt" inputmode="tel"></div></div><div class="field"><label>Address</label><textarea id="c_addr"></textarea></div><div class="grid2"><div class="field"><label>Aadhaar (optional)</label><input id="c_aad"></div><div class="field"><label>PAN (optional)</label><input id="c_pan"></div></div><div class="v4section">Guarantor Details</div><div class="grid2"><div class="field"><label>Name</label><input id="c_gname"></div><div class="field"><label>Mobile</label><input id="c_gmobile" inputmode="tel"></div></div><div class="field"><label>Address</label><textarea id="c_gaddr"></textarea></div><div class="field"><label>Notes</label><textarea id="c_notes"></textarea></div><div class="btnrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCustomer()">Save Customer</button></div>`)}
function saveCustomer(){let name=document.getElementById('c_name').value.trim();if(!name)return toast('Name enter பண்ணுங்க');db.customers.push({id:uid('c_'),name,mobile:document.getElementById('c_mobile').value,alt:document.getElementById('c_alt').value,address:document.getElementById('c_addr').value,aadhaar:document.getElementById('c_aad').value,pan:document.getElementById('c_pan').value,guarantorName:document.getElementById('c_gname').value,guarantorMobile:document.getElementById('c_gmobile').value,guarantorAddress:document.getElementById('c_gaddr').value,notes:document.getElementById('c_notes').value});save();closeModal();render();toast('Customer saved ✓')}
function openFinance(prefillCustomer){if(!db.customers.length){openCustomer();return}let opts=db.customers.map(c=>`<option value="${c.id}" ${prefillCustomer===c.id?'selected':''}>${esc(c.name)} - ${esc(c.mobile||'')}</option>`).join('');modal(`<h2>New Finance</h2><div class="field"><label>Customer *</label><select id="f_c">${opts}</select></div><div class="v4section">Vehicle / RC Details</div><div class="grid2"><div class="field"><label>Vehicle No *</label><input id="f_v" placeholder="TN00AA0000"></div><div class="field"><label>Make / Model</label><input id="f_model" placeholder="Activa 6G"></div></div><div class="grid2"><div class="field"><label>Vehicle Year</label><input id="f_year" type="number" min="1950" max="2100"></div><div class="field"><label>RC Owner</label><input id="f_owner"></div></div><div class="grid2"><div class="field"><label>RC Date</label><input id="f_rcdate" type="date"></div><div class="field"><label>Chassis No</label><input id="f_chassis"></div></div><div class="grid2"><div class="field"><label>Engine No</label><input id="f_engine"></div><div class="field"><label>Insurance Expiry</label><input id="f_ins" type="date"></div></div><div class="grid2"><div class="field"><label>FC Expiry</label><input id="f_fc" type="date"></div><div class="field"><label>Loan Date</label><input id="f_date" type="date" value="${today()}"></div></div><div class="v4section">Finance Details</div><div class="grid2"><div class="field"><label>Vehicle Price</label><input id="f_price" type="number" oninput="calcFinance()"></div><div class="field"><label>Down Payment</label><input id="f_down" type="number" oninput="calcFinance()"></div></div><div class="grid2"><div class="field"><label>Document Charge %</label><input id="f_doc" type="number" step="0.01" value="10" oninput="calcFinance()"></div><div class="field"><label>Interest % / Month</label><input id="f_int" type="number" step="0.01" value="2.5" oninput="calcFinance()"></div></div><div class="field"><label>Tenure (Months)</label><input id="f_ten" type="number" min="1" value="12" oninput="calcFinance()"></div><div id="f_summary" class="summary"></div><div class="v4section">Vehicle Documents</div><div class="photoRow"><div class="photoBox"><label class="v4label">RC Front</label><input type="file" accept="image/*" onchange="previewDoc(this,'f_rcfront')"><div id="f_rcfront"></div></div><div class="photoBox"><label class="v4label">RC Back</label><input type="file" accept="image/*" onchange="previewDoc(this,'f_rcback')"><div id="f_rcback"></div></div><div class="photoBox"><label class="v4label">Insurance</label><input type="file" accept="image/*" onchange="previewDoc(this,'f_insphoto')"><div id="f_insphoto"></div></div><div class="photoBox"><label class="v4label">Other Document</label><input type="file" accept="image/*" onchange="previewDoc(this,'f_otherdoc')"><div id="f_otherdoc"></div></div></div><div class="notice" style="margin-top:12px">Documents phone-la locally save ஆகும். Real customer data use பண்ணுவதற்கு முன் backup வைத்துக்கொள்ளுங்கள்.</div><div class="btnrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveFinance()">Save Finance</button></div>`);calcFinance()}
function calcData(){let price=+document.getElementById('f_price').value||0,down=+document.getElementById('f_down').value||0,docPct=+document.getElementById('f_doc').value||0,interest=+document.getElementById('f_int').value||0,ten=Math.max(1,parseInt(document.getElementById('f_ten').value||1)),loan=document.getElementById('f_date').value||today(),balance=Math.max(0,price-down),doc=balance*docPct/100,finance=balance+doc,mi=finance*interest/100,emi=finance/ten+mi,total=emi*ten;return{price,down,docPct,interest,ten,loan,balance,doc,finance,mi,emi,total}}
function calcFinance(){let c=calcData(),rows='';for(let i=1;i<=c.ten;i++)rows+=`<tr><td>${i}</td><td>${addMonths(c.loan,i)}</td><td>${money(c.emi)}</td></tr>`;document.getElementById('f_summary').innerHTML=`<b>Balance:</b> ${money(c.balance)} &nbsp; <b>Document:</b> ${money(c.doc)}<br><b>Finance:</b> ${money(c.finance)} &nbsp; <b>Monthly Interest:</b> ${money(c.mi)}<br><b>EMI:</b> ${money(c.emi)} &nbsp; <b>Total Payable:</b> ${money(c.total)}<div style="margin-top:10px;overflow:auto"><table class="schedule"><tr><th>Due</th><th>Date</th><th>Amount</th></tr>${rows}</table></div>`}
async function fileData(id){let el=document.querySelector(`input[onchange*="'${id}'"]`);let f=el&&el.files&&el.files[0];if(!f)return '';return await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
function previewDoc(input,target){let f=input.files[0],box=document.getElementById(target);if(!f){box.innerHTML='';return}let r=new FileReader();r.onload=()=>box.innerHTML=`<img src="${r.result}" alt="document preview">`;r.readAsDataURL(f)}
async function saveFinance(){let c=calcData(),customerId=document.getElementById('f_c').value,v=document.getElementById('f_v').value.trim();if(!v||!c.price)return toast('Vehicle No & Vehicle Price தேவை');let schedule=[];for(let i=1;i<=c.ten;i++)schedule.push({no:i,dueDate:addMonths(c.loan,i),amount:c.emi,status:'Pending',paidDate:null});let docs={rcFront:await fileData('f_rcfront'),rcBack:await fileData('f_rcback'),insurance:await fileData('f_insphoto'),other:await fileData('f_otherdoc')};let f={id:uid('f_'),customerId,vehicleNo:v,model:document.getElementById('f_model').value,year:+document.getElementById('f_year').value||'',rcOwner:document.getElementById('f_owner').value,rcDate:document.getElementById('f_rcdate').value,chassis:document.getElementById('f_chassis').value,engine:document.getElementById('f_engine').value,insurance:document.getElementById('f_ins').value,fcExpiry:document.getElementById('f_fc').value,loanDate:c.loan,price:c.price,down:c.down,docPct:c.docPct,documentCharge:c.doc,interest:c.interest,tenure:c.ten,financeAmount:c.finance,monthlyInterest:c.mi,emi:c.emi,totalPayable:c.total,paidAmount:0,outstanding:c.total,schedule,docs};db.finances.push(f);db.vehicles.push({id:uid('v_'),financeId:f.id,vehicleNo:v,model:f.model,year:f.year,rcOwner:f.rcOwner,rcDate:f.rcDate,chassis:f.chassis,engine:f.engine,insurance:f.insurance,fcExpiry:f.fcExpiry,docs});if(c.down)db.transactions.push({id:uid('t_'),type:'income',category:'Down Payment',amount:c.down,note:v,date:new Date().toISOString()});save();closeModal();go('customers');toast('Finance saved ✓')}
function openPayment(fid){if(!fid){let f=db.finances.find(x=>dueStatus(x)!=='COMPLETED');fid=f?.id}if(!fid)return toast('Finance account இல்லை');let f=db.finances.find(x=>x.id===fid);if(!f)return;let c=db.customers.find(x=>x.id===f.customerId),inst=installmentFor(f);modal(`<h2>Collect EMI</h2><div class="detailhead"><b>${esc(c?.name||'Customer')}</b><div class="sub">${esc(f.vehicleNo||'')} · EMI #${inst} / ${f.tenure}</div><div style="font-size:23px;font-weight:850;margin-top:7px">${money(f.emi)}</div></div><div class="field"><label>Amount</label><input id="p_amt" type="number" value="${Number(f.emi||0).toFixed(2)}"></div><div class="field"><label>Payment Mode</label><select id="p_mode"><option>Cash</option><option>UPI</option><option>Bank</option></select></div><div class="field"><label>Note</label><input id="p_note" placeholder="Optional"></div><div class="btnrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment('${fid}',${inst})">Confirm Payment</button></div>`)}
function savePayment(fid,inst){let a=+document.getElementById('p_amt').value||0;if(!a)return toast('Amount enter பண்ணுங்க');db.payments.push({id:uid('p_'),financeId:fid,installment:inst,amount:a,mode:document.getElementById('p_mode').value,note:document.getElementById('p_note').value,date:new Date().toISOString()});db.transactions.push({id:uid('t_'),type:'income',category:'EMI Collection',amount:a,note:db.finances.find(f=>f.id===fid)?.vehicleNo||'',date:new Date().toISOString()});save();closeModal();render();toast('Payment saved ✓')}
function openTransaction(type){modal(`<h2>${type==='income'?'Add Income':'Add Expense'}</h2><div class="field"><label>Category</label><input id="t_cat" placeholder="${type==='income'?'Other Income':'Petrol / Rent / Salary'}"></div><div class="field"><label>Amount</label><input id="t_amt" type="number"></div><div class="field"><label>Note</label><input id="t_note"></div><div class="btnrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTransaction('${type}')">Save</button></div>`)}function saveTransaction(type){let a=+document.getElementById('t_amt').value||0,c=document.getElementById('t_cat').value.trim()||'Other';if(!a)return toast('Amount enter பண்ணுங்க');db.transactions.push({id:uid('t_'),type,category:c,amount:a,note:document.getElementById('t_note').value,date:new Date().toISOString()});save();closeModal();render();toast('Transaction saved ✓')}
function customerDetail(id){let c=db.customers.find(x=>x.id===id),fs=db.finances.filter(f=>f.customerId===id);let orphan=fs.filter(f=>!f.customerId);modal(`<h2>${esc(c.name)}</h2><div class="detailhead"><b>📞 ${esc(c.mobile||'-')}</b><div class="sub">${esc(c.address||'Address not added')}</div></div><div class="v4section">Customer Details</div><div class="card"><div><b>Alternate:</b> ${esc(c.alt||'-')}</div><div><b>Aadhaar:</b> ${esc(c.aadhaar||'-')}</div><div><b>PAN:</b> ${esc(c.pan||'-')}</div><div style="margin-top:8px"><b>Guarantor:</b> ${esc(c.guarantorName||'-')} · ${esc(c.guarantorMobile||'-')}</div><div style="margin-top:8px"><b>Notes:</b> ${esc(c.notes||'-')}</div></div><div class="v4section">Finance Accounts</div>${fs.length?fs.map(f=>{let paid=paidFor(f),inst=db.payments.filter(p=>p.financeId===f.id).length,pct=Math.min(100,inst/(f.tenure||1)*100),next=f.schedule?.[inst];return `<div class="card" style="margin-bottom:10px"><div class="row"><b>${esc(f.vehicleNo||'')}</b><span class="pill ${dueStatus(f)==='COMPLETED'?'':'amber'}">${dueStatus(f)}</span></div><div class="muted">${esc(f.model||'')} · EMI ${money(f.emi)} · ${f.tenure} months</div><div style="margin-top:8px">Vehicle Year: ${esc(f.year||'-')} · RC Owner: ${esc(f.rcOwner||'-')}</div><div class="muted" style="margin-top:5px">Chassis: ${esc(f.chassis||'-')} · Engine: ${esc(f.engine||'-')}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="row" style="margin-top:7px"><span class="muted">Outstanding</span><b>${money(outstanding(f))}</b></div>${next?`<div class="small muted" style="margin-top:5px">Next due: ${next.dueDate} · ${money(next.amount)}</div>`:''}<div class="btnrow"><button class="btn" onclick="viewFinance('${f.id}')">View Details</button>${dueStatus(f)!=='COMPLETED'?`<button class="btn primary" onclick="closeModal();openPayment('${f.id}')">Collect EMI</button>`:''}</div></div>`}).join(''):'<div class="empty">Finance இல்லை</div>'}<div class="btnrow"><button class="btn primary" onclick="closeModal();openFinance('${id}')">＋ Add Finance</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function viewFinance(id){let f=db.finances.find(x=>x.id===id);if(!f)return;let c=db.customers.find(x=>x.id===f.customerId),rows=(f.schedule||[]).map(s=>`<tr><td>${s.no}</td><td>${s.dueDate}</td><td>${money(s.amount)}</td><td>${s.status==='Paid'?'<span class="pill">PAID</span>':'<span class="pill amber">Pending</span>'}</td></tr>`).join('');modal(`<h2>${esc(f.vehicleNo)}</h2><div class="detailhead"><b>${esc(c?.name||'Customer')}</b><div class="sub">${esc(f.model||'')} · ${esc(f.rcOwner||'-')}</div><div style="font-size:22px;font-weight:850;margin-top:7px">EMI ${money(f.emi)}</div></div><div class="card"><b>Vehicle</b><div class="muted" style="margin-top:6px">Year ${esc(f.year||'-')} · RC Date ${esc(f.rcDate||'-')}<br>Chassis ${esc(f.chassis||'-')}<br>Engine ${esc(f.engine||'-')}<br>Insurance ${esc(f.insurance||'-')} · FC ${esc(f.fcExpiry||'-')}</div></div><div class="card" style="margin-top:10px"><b>Finance</b><div class="muted" style="margin-top:6px">Price ${money(f.price)} · Down ${money(f.down)}<br>Balance ${money(f.balance||Math.max(0,(f.price||0)-(f.down||0)))} · Document ${money(f.documentCharge)}<br>Finance ${money(f.financeAmount||f.amount)} · Interest ${f.interest}% / month<br>Total Payable ${money(f.totalPayable)}</div></div><div style="margin-top:12px;overflow:auto"><table class="schedule"><tr><th>#</th><th>Due Date</th><th>Amount</th><th>Status</th></tr>${rows}</table></div><div class="btnrow"><button class="btn" onclick="closeModal();customerDetail('${f.customerId}')">Back</button></div>`)}
function search(q){q=q.trim().toLowerCase();if(!q)return;let c=db.customers.find(x=>[x.name,x.mobile,x.alt,x.address].join(' ').toLowerCase().includes(q)),f=db.finances.find(x=>[x.vehicleNo,x.model,x.rcOwner,x.engine,x.chassis].join(' ').toLowerCase().includes(q));if(c){page='customers';render();setTimeout(()=>customerDetail(c.id),50)}else if(f){viewFinance(f.id)}}
function modal(html){let m=document.getElementById('modal');m.innerHTML='<div class="sheet">'+html+'</div>';m.classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openSettings(){modal(`<h2>Settings & Backup</h2><button class="btn" style="width:100%;margin-bottom:8px" onclick="changePinSafe()">🔐 Change PIN</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="backupData()">💾 Backup Data</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="restoreData()">♻️ Restore Backup</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="lockAppSafe()">🔒 Lock App</button><button class="btn" style="width:100%" onclick="closeModal()">Close</button>`)}
function backupData(){let blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vetri-vinayaga-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded ✓')}
function restoreData(){let i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{try{let p=JSON.parse(await i.files[0].text());if(!p.data||!Array.isArray(p.data.customers))throw 0;db=p.data;db.customers=db.customers||[];db.finances=db.finances||[];db.payments=db.payments||[];db.transactions=db.transactions||[];save();closeModal();render();toast('Backup restored ✓')}catch(e){toast('Invalid backup file')}};i.click()}

<div id="pinArea"></div><script>
// Keep existing V2 PIN implementation from V3 build when available; fallback setup/login.
const PIN_KEY='vvaf_pin_hash_v2';
async function hashPin(pin){const b=new TextEncoder().encode(pin),h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function showLogin(mode='login'){let title=mode==='setup'?'Set 4-digit PIN':'Enter PIN';let box=document.createElement('div');box.id='pinOverlay';box.style='position:fixed;inset:0;background:#0b1220;z-index:500;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px';box.innerHTML=`<div style="width:100%;max-width:380px;text-align:center"><div style="font-size:34px;font-weight:900">Vetri Vinayaga</div><div style="opacity:.7;margin:5px 0 22px">Auto Finance</div><h2>${title}</h2><input id="pinInput" inputmode="numeric" maxlength="4" type="password" style="width:100%;padding:16px;border-radius:16px;border:0;font-size:24px;text-align:center;letter-spacing:10px"><button id="pinBtn" style="width:100%;margin-top:12px;padding:15px;border:0;border-radius:16px;background:#2166d9;color:#fff;font-weight:900;font-size:17px">Continue</button></div>`;document.body.appendChild(box);document.getElementById('pinBtn').onclick=()=>submitPin(mode);}
async function submitPin(mode){let v=document.getElementById('pinInput').value;if(!/^\d{4}$/.test(v))return toast('4 digit PIN enter பண்ணுங்க');let h=await hashPin(v);if(mode==='setup'){localStorage.setItem(PIN_KEY,h);sessionStorage.setItem('vvaf_unlocked','1');document.getElementById('pinOverlay').remove();return}if(mode==='login'){if(h!==localStorage.getItem(PIN_KEY))return toast('Wrong PIN');sessionStorage.setItem('vvaf_unlocked','1');document.getElementById('pinOverlay').remove();return}if(mode==='change'){let h2=await hashPin(v);localStorage.setItem(PIN_KEY,h2);toast('PIN changed ✓');document.getElementById('pinOverlay')?.remove()}}
function changePin(){let old=prompt('Current PIN');if(old===null)return;hashPin(old).then(h=>{if(h!==localStorage.getItem(PIN_KEY))return toast('Wrong current PIN');let n=prompt('New 4-digit PIN');if(!n||!/^[0-9]{4}$/.test(n))return toast('Invalid new PIN');hashPin(n).then(h2=>{localStorage.setItem(PIN_KEY,h2);toast('PIN changed ✓')})})}
function lockApp(){sessionStorage.removeItem('vvaf_unlocked');location.reload()}
if(!localStorage.getItem(PIN_KEY))showLogin('setup');else if(sessionStorage.getItem('vvaf_unlocked')!=='1')showLogin('login');
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));</script></body></html>
