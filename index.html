function cizingExpenseTotal(x){return Number(x?.recoveryExpense||0)+Number(x?.repairExpense||0)+Number(x?.parkingExpense||0)+Number(x?.otherExpense||0)}function cizingExpenseTotalAll(){return db.cizings.reduce((a,x)=>a+cizingExpenseTotal(x),0)}function cizingExpenseOnDate(date){return db.cizings.filter(x=>dateKey(x.date)===date).reduce((a,x)=>a+cizingExpenseTotal(x),0)}function cizingExpenseInMonth(month){return db.cizings.filter(x=>monthKey(x.date)===month).reduce((a,x)=>a+cizingExpenseTotal(x),0)}
function cizingCustomerReport(from,to){let inRange=x=>{let d=dateKey(x.date);return d>=from&&d<=to},rows={};db.cizings.filter(inRange).forEach(x=>{let f=db.finances.find(z=>z.id===x.financeId),c=db.customers.find(z=>z.id===(f?.customerId||x.customerId));let key=c?.id||x.customerId||x.id;if(!rows[key])rows[key]={name:c?.name||x.customerName||'Customer',mobile:c?.mobile||x.mobile||'',count:0,recovery:0,repair:0,parking:0,other:0,total:0};let r=rows[key];r.count++;r.recovery+=Number(x.recoveryExpense||0);r.repair+=Number(x.repairExpense||0);r.parking+=Number(x.parkingExpense||0);r.other+=Number(x.otherExpense||0);r.total+=cizingExpenseTotal(x)});return Object.values(rows).sort((a,b)=>b.total-a.total)}

function financeProfitReport(from,to){
 let inRange=x=>{let d=dateKey(x.date);return d>=from&&d<=to};
 let ciz={};
 db.cizings.filter(inRange).forEach(x=>{ciz[x.financeId]=(ciz[x.financeId]||0)+cizingExpenseTotal(x)});
 return db.finances.map(f=>{
  let c=db.customers.find(x=>x.id===f.customerId), allPs=db.payments.filter(p=>p.financeId===f.id).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))), selectedPs=allPs.filter(inRange);
  let monthlyInterest=financeMonthlyInterest(f), interestByInst={}, selectedCollected=0, selectedInterest=0;

  });

 }).filter(r=>r.collected||r.cizingExpense).sort((a,b)=>b.netProfit-a.netProfit)
}

let collectionTab='pending';
function nextDue(f){
  let inst=installmentFor(f);
  let scheduled=f.schedule&&f.schedule[inst-1];
  if(scheduled&&scheduled.dueDate&&/^\d{4}-\d{2}-\d{2}$/.test(String(scheduled.dueDate))){return {...scheduled,no:inst,amount:Number(scheduled.amount||f.emi||0)}}
  let ps=db.payments.filter(p=>p.financeId===f.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
  let first=ps.find(p=>Number(p.installment||0)===1)||ps[0];
  let base=f.loanDate || (first&&first.date?String(first.date).slice(0,10):'');
  if(base&&f.tenure){let due=addMonths(base, f.loanDate ? inst : Math.max(1,inst-1));return {no:inst,dueDate:due,amount:Number(f.emi||0),status:'Pending',paidDate:null}}
  return null;
}

function collection(){
  let active=db.finances.filter(f=>dueStatus(f)!=='COMPLETED');
  let todayKey=today();
  let fs=active.filter(f=>{
    let d=nextDue(f)?.dueDate;
    if(collectionTab==='overdue') return d ? d<todayKey : false;
    if(collectionTab==='upcoming') return d ? d>todayKey : false;
    return d ? d===todayKey : true;
  }).sort((a,b)=>String(nextDue(a)?.dueDate||'').localeCompare(String(nextDue(b)?.dueDate||'')));
  return `<div class="top"><div class="brand">EMI Collection</div><div class="sub">Due / Pending / Payment history</div></div><div class="content">
  <div class="tab"><button class="${collectionTab==='pending'?'sel':''}" onclick="setCollectionTab('pending')">Pending</button><button class="${collectionTab==='overdue'?'sel':''}" onclick="setCollectionTab('overdue')">Overdue</button><button class="${collectionTab==='upcoming'?'sel':''}" onclick="setCollectionTab('upcoming')">Upcoming</button></div>
  ${fs.length?`<div class="list">${fs.map(f=>{let c=db.customers.find(x=>x.id===f.customerId),inst=installmentFor(f),d=nextDue(f)?.dueDate||'-';return `<div class="item"><div class="row"><b>${esc(c?.name||'Customer')}</b><span class="pill ${collectionTab==='overdue'?'amber':''}">${collectionTab==='overdue'?'OVERDUE':collectionTab==='upcoming'?'UPCOMING':'DUE'}</span></div><div class="muted">${esc(f.vehicleNo||'')} · EMI #${inst} / ${f.tenure}</div><div class="muted" style="margin-top:5px">📅 Due Date: ${esc(d)}</div><div class="row" style="margin-top:8px;gap:8px"><b>${money(f.emi)}</b><div style="display:flex;gap:8px"><button class="btn" onclick="whatsappReminder('${f.id}')">💬 WhatsApp</button><button class="btn primary" onclick="openPayment('${f.id}')">Collect</button></div></div></div>`}).join('')}</div>`:`<div class="empty">${collectionTab==='overdue'?'Overdue EMI இல்லை.':collectionTab==='upcoming'?'Upcoming EMI இல்லை.':'Today pending EMI இல்லை.'}</div>`}
  </div>${nav()}<button class="fab" onclick="openPayment()">＋</button>`
}
function whatsappReminder(fid){

function customerDetail(id){let c=db.customers.find(x=>x.id===id),fs=db.finances.filter(f=>f.customerId===id);let orphan=fs.filter(f=>!f.customerId);modal(`<h2>${esc(c.name)}</h2><div class="detailhead"><b>📞 ${esc(c.mobile||'-')}</b><div class="sub">${esc(c.address||'Address not added')}</div></div><div class="v4section">Customer Details</div><div class="card"><div><b>Alternate:</b> ${esc(c.alt||'-')}</div><div><b>Aadhaar:</b> ${esc(c.aadhaar||'-')}</div><div><b>PAN:</b> ${esc(c.pan||'-')}</div><div style="margin-top:8px"><b>Guarantor:</b> ${esc(c.guarantorName||'-')} · ${esc(c.guarantorMobile||'-')}</div><div style="margin-top:8px"><b>Notes:</b> ${esc(c.notes||'-')}</div><div class="btnrow"><button class="btn primary" onclick="openEditCustomer('${id}')">✏️ Edit Customer</button><button class="btn" style="border-color:#ef4444;color:#b91c1c" onclick="deleteCustomer('${id}')">🗑️ Delete Customer</button></div></div><div class="v4section">Finance Accounts</div>${fs.length?fs.map(f=>{let paid=paidFor(f),inst=db.payments.filter(p=>p.financeId===f.id).length,pct=Math.min(100,inst/(f.tenure||1)*100),next=f.schedule?.[inst];return `<div class="card" style="margin-bottom:10px"><div class="row"><b>${esc(f.vehicleNo||'')}</b><span class="pill ${dueStatus(f)==='COMPLETED'?'':'amber'}">${dueStatus(f)}</span></div><div class="muted">${esc(f.model||'')} · EMI ${money(f.emi)} · ${f.tenure} months</div><div style="margin-top:8px">Vehicle Year: ${esc(f.year||'-')} · RC Owner: ${esc(f.rcOwner||'-')}</div><div class="muted" style="margin-top:5px">Chassis: ${esc(f.chassis||'-')} · Engine: ${esc(f.engine||'-')}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="row" style="margin-top:7px"><span class="muted">Outstanding</span><b>${money(outstanding(f))}</b></div>${next?`<div class="small muted" style="margin-top:5px">Next due: ${next.dueDate} · ${money(next.amount)}</div>`:''}<div class="btnrow"><button class="btn" onclick="viewFinance('${f.id}')">View Details</button>${dueStatus(f)!=='COMPLETED'?`<button class="btn primary" onclick="closeModal();openPayment('${f.id}')">Collect EMI</button>`:''}</div></div>`}).join(''):'<div class="empty">Finance இல்லை</div>'}<div class="btnrow"><button class="btn primary" onclick="closeModal();openFinance('${id}')">＋ Add Finance</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function viewFinance(id){
 let f=db.finances.find(x=>x.id===id);if(!f)return;
 let c=db.customers.find(x=>x.id===f.customerId);
 let pays=db.payments.filter(p=>p.financeId===f.id);
 let paidTotal=pays.reduce((a,p)=>a+Number(p.amount||0),0);
 let paidInst=new Set(pays.map(p=>Number(p.installment||0)));
 let total=f.tenure||0;
 let nextNo=1;for(let i=1;i<=total;i++){if(!paidInst.has(i)){nextNo=i;break}}
 let rows='';
 for(let i=1;i<=total;i++){
   let sch=f.schedule&&f.schedule[i-1];
   let due=sch?.dueDate||'';
   if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(String(due))){let base=f.loanDate||(pays[0]?.date?String(pays[0].date).slice(0,10):'');due=base?addMonths(base,i):'-'}
   let pp=pays.filter(p=>Number(p.installment||0)===i);
   let isPaid=pp.length>0;
   let isToday=due===today();
   let isOverdue=!isPaid && due!=='-' && due<today();
   let status=isPaid?'<span class="pill">PAID</span>':isOverdue?'<span class="pill amber">OVERDUE</span>':isToday?'<span class="pill amber">DUE TODAY</span>':'<span class="pill">UPCOMING</span>';
   let amount=Number(sch?.amount||f.emi||0);
   rows+=`<tr><td>${i}</td><td>${due||'-'}</td><td>${money(amount)}</td><td>${status}</td></tr>`;
 }
 let pct=total?Math.min(100,paidInst.size/total*100):0;
 modal(`<h2>${esc(f.vehicleNo||'Finance Account')}</h2>
 <div class="detailhead"><b>${esc(c?.name||'Customer')}</b><div class="sub">📞 ${esc(c?.mobile||'-')} · ${esc(f.model||'')}</div><div style="font-size:22px;font-weight:850;margin-top:7px">EMI ${money(f.emi)} · ${total} months</div></div>
 <div class="cards" style="margin-top:10px"><div class="card"><div class="muted">Paid</div><div class="metric green">${money(paidTotal)}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric blue">${money(outstanding(f))}</div></div></div>
 <div class="card" style="margin-top:10px"><div class="row"><b>EMI Progress</b><b>${paidInst.size} / ${total}</b></div><div class="progress"><i style="width:${pct}%"></i></div>${nextNo<=total?`<div class="small muted" style="margin-top:8px">Next unpaid EMI: #${nextNo}</div>`:'<div class="small green" style="margin-top:8px;font-weight:800">Finance completed ✓</div>'}</div>
 <div class="v4section">Vehicle Details</div><div class="card"><div class="muted">Year ${esc(f.year||'-')} · RC Owner ${esc(f.rcOwner||'-')}<br>Chassis ${esc(f.chassis||'-')}<br>Engine ${esc(f.engine||'-')}<br>Insurance ${esc(f.insurance||'-')} · FC ${esc(f.fcExpiry||'-')}</div></div>
 <div class="v4section">Finance Details</div><div class="card"><div class="muted">Loan Date ${esc(f.loanDate||'-')}<br>Loan Amount ${money(f.financeAmount||f.finance||f.amount)}<br>Interest 2.50% / month<br>EMI ${money(f.emi)}<br>Tenure ${Number(f.tenure||0)} months<br>Total Payable ${money(f.totalPayable)}</div></div>
 <div class="v4section">Full EMI Schedule</div><div style="overflow:auto"><table class="schedule"><tr><th>#</th><th>Due Date</th><th>Amount</th><th>Status</th></tr>${rows}</table></div>
 <div class="btnrow">${nextNo<=total?`<button class="btn primary" onclick="closeModal();openPayment('${f.id}')">Collect EMI #${nextNo}</button>`:''}<button class="btn" onclick="openEditFinance('${f.id}')">✏️ Edit Finance</button><button class="btn" style="border-color:#ef4444;color:#b91c1c" onclick="deleteFinance('${f.id}')">🗑️ Delete Finance</button><button class="btn" onclick="closeModal();customerDetail('${f.customerId}')">Back</button></div>`)
}
function openEditFinance(id){
 let f=db.finances.find(x=>x.id===id);if(!f)return toast('Finance account இல்லை');
 let paidInst=db.payments.filter(p=>p.financeId===id).map(p=>Number(p.installment||0));
 let maxPaid=paidInst.length?Math.max(...paidInst):0;
 modal(`<h2>✏️ Edit Finance</h2>
 <div class="detailhead"><b>${esc(f.vehicleNo||'')}</b><div class="sub">${esc(db.customers.find(x=>x.id===f.customerId)?.name||'Customer')}</div></div>
 <div class="field"><label>Loan Amount</label><input id="ef_loan" type="number" min="0" step="1" value="${Number(f.financeAmount||f.finance||f.amount||0)}" oninput="calcEditFinance()"></div>

 <div class="notice" style="margin-top:12px">Already collected EMI-கள் பாதுகாப்பாக இருக்கும். Paid EMI count-க்கு குறைவான tenure-ஐ set செய்ய முடியாது.</div>

function editFinanceData(){
 let loan=+document.getElementById('ef_loan').value||0,ten=Math.max(1,parseInt(document.getElementById('ef_ten').value||1)),date=document.getElementById('ef_date').value||today(),interest=2.5,mi=loan*interest/100,raw=loan/ten+mi,emi=Math.round(raw/10)*10,total=emi*ten;return{loan,ten,date,interest,mi,raw,emi,total};
}
function calcEditFinance(){
 let c=editFinanceData(),rows='';
 for(let i=1;i<=c.ten;i++)rows+=`<tr><td>${i}</td><td>${addMonths(c.date,i)}</td><td>${money(c.emi)}</td></tr>`;
 document.getElementById('ef_summary').innerHTML=`<b>Loan Amount:</b> ${money(c.loan)} &nbsp; <b>Interest:</b> 2.50% / month<br><b>Monthly Interest:</b> ${money(c.mi)}<br><b>EMI:</b> ${money(c.emi)} &nbsp; <b>Total Payable:</b> ${money(c.total)}<div style="margin-top:10px;overflow:auto"><table class="schedule"><tr><th>EMI</th><th>Due Date</th><th>Amount</th></tr>${rows}</table></div>`;
}
function saveEditedFinance(id){
 let f=db.finances.find(x=>x.id===id);if(!f)return toast('Finance account இல்லை');
 let pays=db.payments.filter(p=>p.financeId===id),maxPaid=pays.length?Math.max(...pays.map(p=>Number(p.installment||0))):0,c=editFinanceData();
 if(!c.loan)return toast('Loan Amount enter பண்ணுங்க');
 if(c.ten<maxPaid)return toast(`Paid EMI #${maxPaid} வரை இருக்கு. Tenure ${maxPaid} அல்லது அதற்கு மேல் வைக்கவும்`);
 let schedule=[];
 for(let i=1;i<=c.ten;i++)schedule.push({no:i,dueDate:addMonths(c.date,i),amount:c.emi,status:pays.some(p=>Number(p.installment||0)===i)?'Paid':'Pending',paidDate:null});
 f.loanDate=c.date;f.price=c.loan;f.down=0;f.docPct=0;f.documentCharge=0;f.interest=2.5;f.tenure=c.ten;f.financeAmount=c.loan;f.finance=c.loan;f.amount=c.loan;f.monthlyInterest=c.mi;f.emi=c.emi;f.totalPayable=c.total;f.schedule=schedule;f.outstanding=Math.max(0,c.total-paidFor(f));
 save();viewFinance(id);toast('Finance updated ✓');
}

const PIN_KEY='vvaf_pin_hash_v2';
async function hashPin(pin){const b=new TextEncoder().encode(pin),h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function showLogin(mode='login'){let title=mode==='setup'?'Set 4-digit PIN':'Enter PIN';let box=document.createElement('div');box.id='pinOverlay';box.className='pinProOverlay';box.innerHTML=`<div class="pinProBg"></div><div class="pinProGlow pinProGlow1"></div><div class="pinProGlow pinProGlow2"></div><div class="pinProWrap"><div class="pinBrandTop"><div class="pinLogoRing"><img src="./office-logo.png" alt="Vetri Vinayaga Auto Finance"></div><div class="pinBrandName">VETRI VINAYAGA</div><div class="pinBrandSub">AUTO FINANCE</div><div class="pinBrandTag">நம்பிக்கை & வளர்ச்சி &nbsp;|&nbsp; TRUST & GROWTH</div></div><div class="pinCard"><div class="pinLock">🔒</div><div class="pinTitle">${title}</div><div class="pinHint">Secure access to your account</div><input id="pinInput" class="pinInputPro" inputmode="numeric" maxlength="4" type="password" placeholder="••••" autocomplete="off"><button id="pinBtn" class="pinBtnPro">Continue <span>→</span></button></div><div class="pinFooter">Vetri Vinayaga Auto Finance · ESTD. 2020</div></div>`;document.body.appendChild(box);document.getElementById('pinBtn').onclick=()=>submitPin(mode);setTimeout(()=>document.getElementById('pinInput')?.focus(),120)}async function submitPin(mode){let v=document.getElementById('pinInput').value;if(!/^\d{4}$/.test(v))return toast('4 digit PIN enter பண்ணுங்க');let h=await hashPin(v);if(mode==='setup'){localStorage.setItem(PIN_KEY,h);sessionStorage.setItem('vvaf_unlocked','1');document.getElementById('pinOverlay').remove();return}if(mode==='login'){if(h!==localStorage.getItem(PIN_KEY))return toast('Wrong PIN');sessionStorage.setItem('vvaf_unlocked','1');document.getElementById('pinOverlay').remove();return}if(mode==='change'){let h2=await hashPin(v);localStorage.setItem(PIN_KEY,h2);toast('PIN changed ✓');document.getElementById('pinOverlay')?.remove()}}
function changePin(){let old=prompt('Current PIN');if(old===null)return;hashPin(old).then(h=>{if(h!==localStorage.getItem(PIN_KEY))return toast('Wrong current PIN');let n=prompt('New 4-digit PIN');if(!n||!/^[0-9]{4}$/.test(n))return toast('Invalid new PIN');hashPin(n).then(h2=>{localStorage.setItem(PIN_KEY,h2);toast('PIN changed ✓')})})}
