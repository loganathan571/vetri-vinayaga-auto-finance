const KEY='vvaf_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{customers:[],vehicles:[],finances:[],payments:[],transactions:[]};
db.customers=Array.isArray(db.customers)?db.customers:[];db.vehicles=Array.isArray(db.vehicles)?db.vehicles:[];db.finances=Array.isArray(db.finances)?db.finances:[];db.payments=Array.isArray(db.payments)?db.payments:[];db.cizings=Array.isArray(db.cizings)?db.cizings:[];db.transactions=Array.isArray(db.transactions)?db.transactions:[];[];db.transactions=Array.isArray(db.transactions)?db.transactions:[];
function repairSchedules(){db.finances.forEach(f=>{if(!Array.isArray(f.schedule)||f.schedule.length!==Number(f.tenure||0)||f.schedule.some((x,i)=>!x||!/^\d{4}-\d{2}-\d{2}$/.test(String(x.dueDate||'')))){let ps=db.payments.filter(p=>p.financeId===f.id).sort((a,b)=>new Date(a.date)-new Date(b.date));let first=ps.find(p=>Number(p.installment||0)===1)||ps[0];let base=f.loanDate|| (first&&first.date?String(first.date).slice(0,10):'');if(base&&f.tenure){f.schedule=[];for(let i=1;i<=Number(f.tenure);i++)f.schedule.push({no:i,dueDate:addMonths(base,i),amount:Number(f.emi||0),status:'Pending',paidDate:null});}}});save()}

let page='home';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function today(){return new Date().toISOString().slice(0,10)}function addMonths(s,n){let d=new Date(s+'T12:00:00'),day=d.getDate(),y=d.getFullYear(),m=d.getMonth()+n,last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last),12).toISOString().slice(0,10)}function toast(t){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b1220;color:#fff;padding:12px 17px;border-radius:14px;z-index:300;font-weight:800';document.body.appendChild(x)}x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1800)}
repairSchedules();
function paidFor(f){return db.payments.filter(p=>p.financeId===f.id).reduce((s,p)=>s+Number(p.amount||0),0)}function installmentFor(f){let ps=db.payments.filter(p=>p.financeId===f.id);return Math.min(f.tenure||1,ps.length+1)}function outstanding(f){return Math.max(0,Number(f.totalPayable||0)-paidFor(f))}function dueStatus(f){let paid=db.payments.filter(p=>p.financeId===f.id).length;return paid>=Number(f.tenure||0)?'COMPLETED':'DUE'}
function cizingExpenseTotal(x){return Number(x?.recoveryExpense||0)+Number(x?.repairExpense||0)+Number(x?.parkingExpense||0)+Number(x?.otherExpense||0)}function cizingExpenseTotalAll(){return db.cizings.reduce((a,x)=>a+cizingExpenseTotal(x),0)}function cizingExpenseOnDate(date){return db.cizings.filter(x=>dateKey(x.date)===date).reduce((a,x)=>a+cizingExpenseTotal(x),0)}function cizingExpenseInMonth(month){return db.cizings.filter(x=>monthKey(x.date)===month).reduce((a,x)=>a+cizingExpenseTotal(x),0)}function stats(){let income=db.transactions.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0),expense=db.transactions.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0)+cizingExpenseTotalAll(),out=db.finances.reduce((a,f)=>a+outstanding(f),0);return{income,expense,out,active:db.finances.filter(f=>dueStatus(f)!=='COMPLETED').length}}
function nav(){return `<div class="bottom"><button class="nav ${page==='home'?'active':''}" onclick="go('home')"><span>⌂</span>Home</button><button class="nav ${page==='customers'?'active':''}" onclick="go('customers')"><span>👤</span>Customers</button><button class="nav ${page==='collection'?'active':''}" onclick="go('collection')"><span>₹</span>Collection</button><button class="nav ${page==='more'?'active':''}" onclick="go('more')"><span>☷</span>More</button></div>`}
function home(){let s=stats(),cz=db.cizings.filter(x=>x.status!=='Released'&&x.status!=='Closed').length;return `<div class="top"><div class="brand">Vetri Vinayaga Auto Finance</div><div class="sub">Second-hand Two Wheeler Finance</div><input class="search" placeholder="🔍 Party / Mobile / Vehicle No" oninput="search(this.value)"></div><div class="content"><div class="title">இன்றைய நிலவரம்</div><div class="cards"><div class="card"><div class="muted">Total Collection</div><div class="metric green">${money(s.income)}</div></div><div class="card"><div class="muted">Total Expense</div><div class="metric red">${money(s.expense)}</div></div><div class="card"><div class="muted">Active Finance</div><div class="metric">${s.active}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric blue">${money(s.out)}</div></div></div><div class="cards" style="margin-top:10px"><div class="card" onclick="go('cizing')" style="cursor:pointer;border:2px solid #f59e0b"><div class="muted">Cizing</div><div class="metric" style="color:#b45309">${cz}</div><div class="small muted">Bike recovery records</div></div></div><div class="actions"><button class="action primary" onclick="openFinance()"><b>＋</b>New Finance</button><button class="action" onclick="go('collection')"><b>₹</b>Collect EMI</button></div><div class="title">Recent Payments</div>${recent()}</div>${nav()}<button class="fab" onclick="openFinance()">＋</button>`}
function recent(){let a=db.payments.slice(-5).reverse();return a.length?`<div class="list">${a.map(p=>{let f=db.finances.find(x=>x.id===p.financeId),c=f&&db.customers.find(x=>x.id===f.customerId);return `<div class="item"><div class="row"><b>${esc(c?.name||'Customer')}</b><span class="pill">PAID</span></div><div class="muted">${esc(f?.vehicleNo||'')} · ${new Date(p.date).toLocaleDateString('en-IN')}</div><div style="margin-top:5px;font-weight:800">${money(p.amount)}</div></div>`}).join('')}</div>`:'<div class="empty">இன்னும் payment இல்லை</div>'}
let cizingFilter='all';
let cizingSearch='';
function setCizingFilter(v){cizingFilter=v;render()}
function setCizingSearch(v){cizingSearch=String(v||'').trim().toLowerCase();render()}
function cizing(){let all=db.cizings.slice().reverse(),statusRows=cizingFilter==='all'?all:all.filter(x=>(x.status||'Cized')===cizingFilter),rows=cizingSearch?statusRows.filter(x=>{let f=db.finances.find(z=>z.id===x.financeId),c=f&&db.customers.find(z=>z.id===f.customerId),hay=[c?.name,c?.mobile,c?.alt,f?.vehicleNo,x.vehicleNo,x.note].filter(Boolean).join(' ').toLowerCase();return hay.includes(cizingSearch)}):statusRows,active=db.cizings.filter(x=>(x.status||'Cized')==='Cized').length,released=db.cizings.filter(x=>x.status==='Released').length,closed=db.cizings.filter(x=>x.status==='Closed').length,activeOutstanding=db.cizings.filter(x=>(x.status||'Cized')==='Cized').reduce((s,x)=>{let f=db.finances.find(z=>z.id===x.financeId);return s+(f?outstanding(f):Number(x.outstanding||0))},0);return `<div class="top"><div class="brand">Cizing</div><div class="sub">Bike recovery records · V39</div></div><div class="content"><div class="title">Cizing Summary</div><div class="cards"><div class="card"><div class="muted">🔴 Cized</div><div class="metric" style="color:#b45309">${active}</div></div><div class="card"><div class="muted">🟢 Released</div><div class="metric green">${released}</div></div><div class="card"><div class="muted">🟤 Closed</div><div class="metric">${closed}</div></div><div class="card"><div class="muted">Total Records</div><div class="metric blue">${db.cizings.length}</div></div><div class="card"><div class="muted">Active Cizing Outstanding</div><div class="metric" style="color:#b45309">${money(activeOutstanding)}</div></div></div><div class="field" style="margin-top:18px"><label>Search Customer / Mobile / Vehicle</label><div style="display:flex;gap:8px"><input id="cz_search" value="${esc(cizingSearch)}" placeholder="Name / Mobile / Vehicle No" onkeydown="if(event.key==='Enter')setCizingSearch(this.value)"><button class="btn primary" onclick="setCizingSearch(document.getElementById('cz_search').value)">Search</button>${cizingSearch?`<button class="btn" onclick="s lay:inline-block!important;min-width:90px!important" onclick="openEditCizing('${x.id}')">✏️ Edit</button>${st==='Cized'?`<button class="btn primary" style="display:inline-block!important;min-width:110px!important" onclick="updateCizingStatus('${x.id}','Released')">🔓 Release</button><button class="btn" style="display:inline-block!important;min-width:100px!important" onclick="updateCizingStatus('${x.id}','Closed')">🔒 Close</button>`:st==='Released'?`<button class="btn" style="display:inline-block!important;min-width:100px!important" onclick="updateCizingStatus('${x.id}','Closed')">🔒 Close</button>`:''}</div></div>`}).join('')}</div>`:`<div class="empty">இந்த filter-ல் Cizing records இல்லை</div>`}</div>${nav()}`}

function openCizing(){if(!db.finances.length)return toast('Finance account இல்லை');let opts=db.finances.filter(f=>dueStatus(f)!=='COMPLETED').map(f=>{let c=db.customers.find(x=>x.id===f.customerId);return `<option value="${f.id}">${esc(c?.name||'Customer')} - ${esc(f.vehicleNo||'')}</option>`}).join('');if(!opts)return toast('Active finance இல்லை');modal(`<h2>🚲 Add Cizing</h2><div class="field"><label>Finance / Vehicle *</label><select id="cz_f">${opts}</select></div><div class="field"><label>Cizing Date</label><input id="cz_date" type="date" value="${today()}"></div><div class="field"><label>Note</label><textarea id="cz_note" placeholder="Reason / custody location / other note"></textarea></div><div class="notice" style="margin-top:12px">Cizing record மட்டும் save ஆகும். Finance account அல்லது payment history delete ஆகாது.</div><div class="btnrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCizing()">Save Cizing</button></div>`)}
function saveCizing(){let fid=document.getElementById('cz_f').value,f=db.finances.find(x=>x.id===fid);if(!f)return toast('Finance account இல்லை');let c=db.customers.find(x=>x.id===f.customerId);db.cizings.push({id:uid('cz_'),financeId:fid,customerId:f.customerId,vehicleNo:f.vehicleNo,date:document.getElementById('cz_date').value||today(),note:document.getElementById('cz_note').value.trim(),status:'Cized',outstanding:outstanding(f),releaseDate:'',closedDate:'',recoveryExpense:0,repairExpense:0,parkingExpense:0,otherExpense:0});save();closeModal();go('cizing');toast('Cizing saved ✓')}
function updateCizingStatus(id,status){let x=db.cizings.find(z=>z.id===id);if(!x)return toast('Cizing record இல்லை');let label=status==='Released'?'Release':'Close',ok=confirm(`${label} status set பண்ணலாமா?`);if(!ok)return;if(status==='Released')x.releaseDate=today();if(status==='Closed')x.closedDate=today();x.status=status;save();render();toast(status+' ✓')}
function openCizingDetails(id){let x=db.cizings.find(z=>z.id===id);if(!x)return toast('Cizing record இல்லை');let f=db.finances.find(z=>z.id===x.financeId),c=f&&db.customers.find(z=>z.id===f.customerId),st=x.status||'Cized',out=f?outstanding(f):Number(x.outstanding||0),paid=f?paidFor(f):0;let exp=Number(x.recoveryExpense||0)+Number(x.repairExpense||0)+Number(x.parkingExpense||0)+Number(x.otherExpense||0);let loan=Number(f?.financeAmount||f?.finance||f?.amount||0);if(!loan&&f){let ten=Number(f.tenure||0),emi=Number(f.emi||0),total=Number(f.totalPayable||0);if(ten&&emi){loan=emi/(1/ten+0.025)}else if(ten&&total){loan=total/(1+0.025*ten)}}modal(`<h2>👁️ Cizing Details</h2><div class="item" style="margin-top:10px"><div class="row"><b>${esc(c?.name||x.customerName||'Customer')}</b><span class="pill ${st==='Released'?'':'amber'}">${esc(st)}</span></div><div class="muted" style="margin-top:6px">📞 ${esc(c?.mobile||'-')}</div><div class="muted">🛵 ${esc(f?.vehicleNo||x.vehicleNo||'-')}</div><div style="margin-top:8px">Loan Amount: <b>${money(loan)}</b></div><div>EMI: <b>${money(f?.emi||0)}</b></div><div>Paid: <b>${money(paid)}</b></div><div>Outstanding: <b>${money(out)}</b></div><div class="muted" style="margin-top:8px">📅 Cizing Date: ${esc(x.date||'-')}</div>${x.releaseDate?`<div class="muted">🔓 Release Date: ${esc(x.releaseDate)}</div>`:''}${x.closedDate?`<div class="muted">🔒 Closed Date: ${esc(x.closedDate)}</div>`:''}<div style="margin-top:8px">Cizing Expense: <b>${money(exp)}</b></div>${exp?`<div class="muted" style="margin-top:5px">🚚 Recovery ${money(x.recoveryExpense||0)} · 🛠️ Repair ${money(x.repairExpense||0)} · 🅿️ Parking ${money(x.parkingExpense||0)} · Other ${money(x.otherExpense||0)}</div>`:''}<div style="margin-top:8px">Note: ${esc(x.note||'-')}</div></div><div class="notice" style="margin-top:12px">இந்த Details view finance/payment history-ஐ மாற்றாது.</div><div class="btnrow"><button class="btn primary" onclick="closeModal()">Close</button></div>`)}

let collectionTab='pending';
function nextDue(f){
  let inst=installmentFor(f);
  let scheduled=f.schedule&&f.schedule[inst-1];
  if(scheduled&&scheduled.dueDate&&/^\d{4}-\d{2}-\d{2}$/.test(String(scheduled.dueDate))){return {...scheduled,no:inst,amount:Number(scheduled.amount||f.emi||0)}}
  let ps=db.payments.filter(p=>p.financeId===f.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
  let first=ps.find(p=>Number(p.installment||0)===1)||ps[0];
  let base=f.loanDate || (first&&first.date?String(first.date).slice(0,10):'');
  if(base&&f.tenure){let due=addMonths(base, f.loanDate ? inst : Math.max(1,inst-1));return {no:inst,dueDate:due,amount:Number(f.emi||0),status:'Pending',paidDate:null}}
  return null;
}

function collection(){
  let active=db.finances.filter(f=>dueStatus(f)!=='COMPLETED');
  let todayKey=today();
  let fs=active.filter(f=>{
    let d=nextDue(f)?.dueDate;
    if(collectionTab==='overdue') return d ? d<todayKey : false;
    if(collectionTab==='upcoming') return d ? d>todayKey : false;
    return d ? d===todayKey : true;
  }).sort((a,b)=>String(nextDue(a)?.dueDate||'').localeCompare(String(nextDue(b)?.dueDate||'')));
  return `<div class="top"><div class="brand">EMI Collection</div><div class="sub">Due / Pending / Payment history</div></div><div class="content">
  <div class="tab"><button class="${collectionTab==='pending'?'sel':''}" onclick="setCollectionTab('pending')">Pending</button><button class="${collectionTab==='overdue'?'sel':''}" onclick="setCollectionTab('overdue')">Overdue</button><button class="${collectionTab==='upcoming'?'sel':''}" onclick="setCollectionTab('upcoming')">Upcoming</button></div>
  ${fs.length?`<div class="list">${fs.map(f=>{let c=db.customers.find(x=>x.id===f.customerId),inst=installmentFor(f),d=nextDue(f)?.dueDate||'-';return `<div class="item"><div class="row"><b>${esc(c?.name||'Customer')}</b><span class="pill ${collectionTab==='overdue'?'amber':''}">${collectionTab==='overdue'?'OVERDUE':collectionTab==='upcoming'?'UPCOMING':'DUE'}</span></div><div class="muted">${esc(f.vehicleNo||'')} · EMI #${inst} / ${f.tenure}</div><div class="muted" style="margin-top:5px">📅 Due Date: ${esc(d)}</div><div class="row" style="margin-top:8px;gap:8px"><b>${money(f.emi)}</b><div style="display:flex;gap:8px"><button class="btn" onclick="whatsappReminder('${f.id}')">💬 WhatsApp</button><button class="btn primary" onclick="openPayment('${f.id}')">Collect</button></div></div></div>`}).join('')}</div>`:`<div class="empty">${collectionTab==='overdue'?'Overdue EMI இல்லை.':collectionTab==='upcoming'?'Upcoming EMI இல்லை.':'Today pending EMI இல்லை.'}</div>`}
  </div>${nav()}<button class="fab" onclick="openPayment()">＋</button>`
}
function whatsappReminder(fid){
  let f=db.finances.find(x=>x.id===fid); if(!f)return;
  let c=db.customers.find(x=>x.id===f.customerId); if(!c)return;
  let mobile=String(c.mobile||'').replace(/\D/g,'');
  if(mobile.length===10) mobile='91'+mobile;
  if(mobile.length<10) return toast('Customer mobile number இல்லை');
  let inst=installmentFor(f),d=nextDue(f)?.dueDate||'-';
  let todayKey=today(), status=d<todayKey?'OVERDUE':d===todayKey?'DUE':'UPCOMING';
  let prettyDate=d==='-'?'-':d.split('-').reverse().join('-');
  let statusTa=status==='OVERDUE'?'தாமதமாக உள்ளது':status==='DUE'?'இன்று செலுத்த வேண்டியது':'வரவிருக்கும் EMI';

function viewFinance(id){

   let status=isPaid?'<span class="pill">PAID</span>':isOverdue?'<span class="pill amber">OVERDUE</span>':isToday?'<span class="pill amber">DUE TODAY</span>':'<span class="pill">UPCOMING</span>';

 <div class="v4section">Vehicle Details</div><div class="card"><div class="muted">Year ${esc(f.year||'-')} · RC Owner ${esc(f.rcOwner||'-')}<br>Chassis ${esc(f.chassis||'-')}<br>Engine ${esc(f.engine||'-')}<br>Insurance ${esc(f.insurance||'-')} · FC ${esc(f.fcExpiry||'-')}</div></div>
 <div class="v4section">Finance Details</div><div class="card"><div class="muted">Loan Date ${esc(f.loanDate||'-')}<br>Loan Amount ${money(f.financeAmount||f.finance||f.amount)}<br>Interest 2.50% / month<br>EMI ${money(f.emi)}<br>Tenure ${Number(f.tenure||0)} months<br>Total Payable ${money(f.totalPayable)}</div></div>
 <div class="v4section">Full EMI Schedule</div><div style="overflow:auto"><table class="schedule"><tr><th>#</th><th>Due Date</th><th>Amount</th><th>Status</th></tr>${rows}</table></div>
 <div class="btnrow">${nextNo<=total?`<button class="btn primary" onclick="closeModal();openPayment('${f.id}')">Collect EMI #${nextNo}</button>`:''}<button class="btn" onclick="openEditFinance('${f.id}')">✏️ Edit Finance</button><button class="btn" onclick="closeModal();customerDetail('${f.customerId}')">Back</button></div>`)

 modal(`<h2>✏️ Edit Finance</h2>
 <div class="detailhead"><b>${esc(f.vehicleNo||'')}</b><div class="sub">${esc(db.customers.find(x=>x.id===f.customerId)?.name||'Customer')}</div></div>
 <div class="field"><label>Loan Amount</label><input id="ef_loan" type="number" min="0" step="1" value="${Number(f.financeAmount||f.finance||f.amount||0)}" oninput="calcEditFinance()"></div>
 <div class="field"><label>Interest % / Month</label><input id="ef_int" type="number" value="2.5" readonly></div>
 <div class="field"><label>Tenure (Months)</label><input id="ef_ten" type="number" min="${Math.max(1,maxPaid)}" value="${Number(f.tenure||1)}" oninput="calcEditFinance()"></div>
 <div class="field"><label>Loan Date</label><input id="ef_date" type="date" value="${esc(f.loanDate||today())}" oninput="calcEditFinance()"></div>
 <div id="ef_summary" class="summary"></div>
 <div class="notice" style="margin-top:12px">Already collected EMI-கள் பாதுகாப்பாக இருக்கும். Paid EMI count-க்கு குறைவான tenure-ஐ set செய்ய முடியாது.</div>
 <div class="btnrow"><button class="btn" onclick="viewFinance('${id}')">Cancel</button><button class="btn primary" onclick="saveEditedFinance('${id}')">Save Changes</button></div>`);
 calcEditFinance();
}
function editFinanceData(){
 let loan=+document.getElementById('ef_loan').value||0,ten=Math.max(1,parseInt(document.getElementById('ef_ten').value||1)),date=document.getElementById('ef_date').value||today(),interest=2.5,mi=loan*interest/100,raw=loan/ten+mi,emi=Math.round(raw/10)*10,total=emi*ten;return{loan,ten,date,interest,mi,raw,emi,total};
}
function calcEditFinance(){
 let c=editFinanceData(),rows='';
 for(let i=1;i<=c.ten;i++)rows+=`<tr><td>${i}</td><td>${addMonths(c.date,i)}</td><td>${money(c.emi)}</td></tr>`;
 document.getElementById('ef_summary').innerHTML=`<b>Loan Amount:</b> ${money(c.loan)} &nbsp; <b>Interest:</b> 2.50% / month<br><b>Monthly Interest:</b> ${money(c.mi)}<br><b>EMI:</b> ${money(c.emi)} &nbsp; <b>Total Payable:</b> ${money(c.total)}<div style="margin-top:10px;overflow:auto"><table class="schedule"><tr><th>EMI</th><th>Due Date</th><th>Amount</th></tr>${rows}</table></div>`;
}
function saveEditedFinance(id){
 let f=db.finances.find(x=>x.id===id);if(!f)return toast('Finance account இல்லை');
 let pays=db.payments.filter(p=>p.financeId===id),maxPaid=pays.length?Math.max(...pays.map(p=>Number(p.installment||0))):0,c=editFinanceData();
 if(!c.loan)return toast('Loan Amount enter பண்ணுங்க');
 if(c.ten<maxPaid)return toast(`Paid EMI #${maxPaid} வரை இருக்கு. Tenure ${maxPaid} அல்லது அதற்கு மேல் வைக்கவும்`);
 let schedule=[];
 for(let i=1;i<=c.ten;i++)schedule.push({no:i,dueDate:addMonths(c.date,i),amount:c.emi,status:pays.some(p=>Number(p.installment||0)===i)?'Paid':'Pending',paidDate:null});
 f.loanDate=c.date;f.price=c.loan;f.down=0;f.docPct=0;f.documentCharge=0;f.interest=2.5;f.tenure=c.ten;f.financeAmount=c.loan;f.finance=c.loan;f.amount=c.loan;f.monthlyInterest=c.mi;f.emi=c.emi;f.totalPayable=c.total;f.schedule=schedule;f.outstanding=Math.max(0,c.total-paidFor(f));
 save();viewFinance(id);toast('Finance updated ✓');
}
function search(q){q=q.trim().toLowerCase();if(!q)return;let c=db.customers.find(x=>[x.name,x.mobile,x.alt,x.address].join(' ').toLowerCase().includes(q)),f=db.finances.find(x=>[x.vehicleNo,x.model,x.rcOwner,x.engine,x.chassis].join(' ').toLowerCase().includes(q));if(c){page='customers';render();setTimeout(()=>customerDetail(c.id),50)}else if(f){viewFinance(f.id)}}
function modal(html){let m=document.getElementById('modal');m.innerHTML='<div class="sheet">'+html+'</div>';m.classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openSettings(){modal(`<h2>Settings & Backup</h2><button class="btn" style="width:100%;margin-bottom:8px" onclick="changePinSafe()">🔐 Change PIN</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="backupData()">💾 Backup Data</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="restoreData()">♻️ Restore Backup</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="lockAppSafe()">🔒 Lock App</button><button class="btn" style="width:100%" onclick="closeModal()">Close</button>`)}
function backupData(){let blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vetri-vinayaga-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded ✓')}
function restoreData(){let i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{try{let p=JSON.parse(await i.files[0].text());if(!p.data||!Array.isArray(p.data.customers))throw 0;db=p.data;db.customers=db.customers||[];db.finances=db.finances||[];db.payments=db.payments||[];db.cizings=db.cizings||[];db.transactions=db.transactions||[];save();closeModal();render();toast('Backup restored ✓')}catch(e){toast('Invalid backup file')}};i.click()}
function changePinSafe(){if(typeof changePin==='function')changePin();else toast('PIN function unavailable')}function lockAppSafe(){if(typeof lockApp==='function')lockApp();else toast('Lock function unavailable')}
render();
</script>
<div id="pinArea"></div><script>
// Keep existing V2 PIN implementation from V3 build when available; fallback setup/login.
const PIN_KEY='vvaf_pin_hash_v2';
async function hashPin(pin){const b=new TextEncoder().encode(pin),h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function showLogin(mode='login'){let title=mode==='setup'?'Set 4-digit PIN':'Enter PIN';let box=document.createElement('div');box.id='pinOverlay';box.style='position:fixed;inset:0;background:#0b1220;z-index:500;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px';box.innerHTML=`<div style="width:100%;max-width:380px;text-align:center"><div style="font-size:34px;font-weight:900">Vetri Vinayaga</div><div style="opacity:.7;margin:5px 0 22px">Auto Finance</div><h2>${title}</h2><input id="pinInput" inputmode="numeric" maxlength="4" type="password" style="width:100%;padding:16px;border-radius:16px;border:0;font-size:24px;text-align:center;letter-spacing:10px"><button id="pinBtn" style="width:100%;margin-top:12px;padding:15px;border:0;border-radius:16px;background:#2166d9;color:#fff;font-weight:900;font-size:17px">Continue</button></div>`;document.body.appendChild(box);document.getElementById('pinBtn').onclick=()=>submitPin(mode);}
async function submitPin(mode){let v=document.getElementById('pinInput').value;if(!/^\d{4}$/.test(v))return toast('4 digit PIN enter பண்ணுங்க');let h=await hashPin(v);if(mode==='setup'){localStorage.setItem(PIN_KEY,h);sessionStorage.setItem('vvaf_unlocked','1');document.getElementById('pinOverlay').remove();return}if(mode==='login'){if(h!==localStorage.getItem(PIN_KEY))return toast('Wrong PIN');sessionStorage.setItem('vvaf_unlocked','1');document.getElementById('pinOverlay').remove();return}if(mode==='change'){let h2=await hashPin(v);localStorage.setItem(PIN_KEY,h2);toast('PIN changed ✓');document.getElementById('pinOverlay')?.remove()}}
function changePin(){let old=prompt('Current PIN');if(old===null)return;hashPin(old).then(h=>{if(h!==localStorage.getItem(PIN_KEY))return toast('Wrong current PIN');let n=prompt('New 4-digit PIN');if(!n||!/^[0-9]{4}$/.test(n))return toast('Invalid new PIN');hashPin(n).then(h2=>{localStorage.setItem(PIN_KEY,h2);toast('PIN changed ✓')})})}
function lockApp(){sessionStorage.removeItem('vvaf_unlocked');location.reload()}
if(!localStorage.getItem(PIN_KEY))showLogin('setup');else if(sessionStorage.getItem('vvaf_unlocked')!=='1')showLogin('login');
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));</script></body></html>
